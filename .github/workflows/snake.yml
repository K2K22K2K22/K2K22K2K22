name: Generate Snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23111111&color_dots=%23EBEDF0,%23FFD6DA,%23FF9AA4,%23E84A5F,%23B5122B
            dist/github-snake-dark.svg?color_snake=%23FFFFFF&color_dots=%23161616,%233A0A0A,%237A1020,%23C1121F,%23FF334F

      - name: Publish to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: output
          force_orphan: true
